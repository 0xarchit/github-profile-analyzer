name: Bug Report
description: Report a bug to help us improve
title: '[BUG] '
labels: bug
body:
  - type: textarea
    attributes:
      label: Describe the Bug
      description: Clear description of what the bug is
    validations:
      required: false
  - type: textarea
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected Behavior
      description: Description of what you expected to happen
    validations:
      required: false
  - type: textarea
    attributes:
      label: Actual Behavior
      description: Description of what actually happened
    validations:
      required: false
  - type: textarea
    attributes:
      label: Screenshots
      description: Add screenshots if applicable
    validations:
      required: false
  - type: markdown
    attributes:
      value: '## Environment'
  - type: input
    attributes:
      label: OS
      description: '[e.g. Windows, macOS, Linux]'
    validations:
      required: false
  - type: input
    attributes:
      label: Browser
      description: '[e.g. Chrome, Firefox, Safari]'
    validations:
      required: false
  - type: input
    attributes:
      label: Version
      description: '[e.g. 1.0.0]'
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description: Any other relevant information
    validations:
      required: false
